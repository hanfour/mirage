<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link id="manifest" rel="manifest">
<title>Mirage 遙控</title>
<style>
*{box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:13px/1.4 monospace}
html,body,#viewport,#nav{touch-action:manipulation}
#viewport{position:fixed;top:var(--view-top,0px);left:var(--view-left,0px);width:var(--view-width,100%);height:var(--view-height,100%);overflow:hidden}
#text-input{position:absolute;bottom:var(--nav-height);left:50%;width:1px;height:1px;opacity:0;font-size:16px;padding:0;border:0;user-select:text;-webkit-user-select:text;touch-action:manipulation}
:root{--nav-height:calc(52px + env(safe-area-inset-bottom,0px))}
:root.no-nav{--nav-height:0px}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain}
#nav{position:absolute;bottom:0;left:0;width:100%;height:var(--nav-height);display:flex;z-index:2;background:#18181bbd;padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#nav button{flex:1;min-width:0;border:0;border-radius:8px;margin:4px;color:#fff;background:#27272a;font:inherit;touch-action:manipulation;user-select:none}
#nav button:active,#nav button.pressed{background:#2563eb}
#nav[hidden],#nav-handle[hidden]{display:none}
#nav-handle{position:absolute;bottom:0;left:0;width:100%;height:24px;padding:0;border:0;background:transparent;z-index:2;touch-action:none}
#panel{position:absolute;top:env(safe-area-inset-top,0px);left:0;max-width:96vw;max-height:calc(100% - var(--nav-height) - env(safe-area-inset-top,0px) - 30px);overflow:hidden;background:#000b;padding:8px;white-space:pre-wrap;cursor:pointer}
details{position:absolute;bottom:max(var(--nav-height),env(safe-area-inset-bottom,0px));left:0;width:100%;background:#000c}
summary{padding:8px}#log{height:24vh;overflow:auto;touch-action:pan-y;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:8px}
#panel{top:calc(env(safe-area-inset-top,0px) + 30px)}
#stats-toggle{position:absolute;top:env(safe-area-inset-top,0px);left:0;border:0;background:#000b;color:#fff;width:28px;height:28px;padding:0;touch-action:manipulation}
#error{position:absolute;top:env(safe-area-inset-top,0px);right:0;max-width:75vw;padding:8px;background:#7f1d1d;pointer-events:none;white-space:pre-wrap}
#panel[hidden],details[hidden],#stats-toggle[hidden],#error[hidden]{display:none}
</style>
<div id="viewport">
<input id="text-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" aria-label="輸入文字後按 Return 提交">
<canvas id="canvas" width="1080" height="2400"></canvas>
<nav id="nav" aria-label="Android 導覽">
<button type="button" data-key="GoBack">◁ 返回</button>
<button type="button" data-key="GoHome">○ 主畫面</button>
<button type="button" data-key="AppSwitch">□ 最近任務</button>
<button id="keyboard" type="button" aria-label="開關文字輸入" aria-pressed="false">⌨︎</button>
</nav>
<button id="nav-handle" type="button" aria-label="顯示導覽列" hidden></button>
<button id="stats-toggle" type="button" aria-label="收合統計">ⓘ</button>
<div id="error" role="alert" hidden></div>
<div id="panel">Initializing…</div><details><summary>統計 / 診斷紀錄（展開可捲動）</summary><pre id="log"></pre></details>
</div>
<script>
const canvas = document.querySelector('#canvas'), ctx = canvas.getContext('2d', {alpha:false});
const panel = document.querySelector('#panel'), log = document.querySelector('#log');
const params = new URLSearchParams(location.search), token = params.get('t') || '';
const navigation = document.querySelector('#nav');
const navDisabled = params.get('nav') === '0';
const navHandle = document.querySelector('#nav-handle');
navigation.hidden = navDisabled;
document.documentElement.classList.toggle('no-nav', navigation.hidden);
let navTimer;
function resetNavigationTimer() {
  clearTimeout(navTimer);
  if (navDisabled || navigation.hidden) return;
  navTimer = setTimeout(() => {
    navigation.hidden = true;
    navHandle.hidden = false;
  }, 3000);
}
function showNavigation() {
  if (navDisabled) return;
  navigation.hidden = false;
  navHandle.hidden = true;
  resetNavigationTimer();
}
navHandle.addEventListener('click', showNavigation);
let handleStartY = null;
for (const type of ['pointerdown', 'pointermove', 'pointerup', 'pointercancel']) {
  navigation.addEventListener(type, e => { e.stopPropagation(); resetNavigationTimer(); });
  navHandle.addEventListener(type, e => {
    e.preventDefault(); e.stopPropagation();
    if (type === 'pointerdown') { handleStartY = e.clientY; navHandle.setPointerCapture(e.pointerId); }
    if (type === 'pointerup' || (type === 'pointermove' && handleStartY !== null && handleStartY - e.clientY >= 8)) showNavigation();
    if (type === 'pointerup' || type === 'pointercancel') handleStartY = null;
  });
}
// Canvas、文字輸入與浮層的互動都延後收合；隱藏後只有把手會叫回。
for (const type of ['pointerdown', 'pointermove', 'pointerup', 'click', 'keydown', 'input']) {
  document.addEventListener(type, resetNavigationTimer);
}
resetNavigationTimer();
for (const button of navigation.querySelectorAll('button[data-key]')) {
  let feedbackTimer;
  button.addEventListener('click', () => {
    send({type:'key', key:button.dataset.key, t:performance.now()});
    button.classList.add('pressed');
    clearTimeout(feedbackTimer);
    feedbackTimer = setTimeout(() => button.classList.remove('pressed'), 180);
    requestWake();
  });
}
const showStats = params.get('stats') !== '0';
const statsToggle = document.querySelector('#stats-toggle'), diagnostics = document.querySelector('details');
const errorPanel = document.querySelector('#error');
let statsCollapsed = true;
try { statsCollapsed = localStorage.getItem('mirage.statsCollapsed') !== '0'; } catch {}
function renderStats() {
  panel.hidden = diagnostics.hidden = !showStats || statsCollapsed;
  statsToggle.hidden = !showStats;
  statsToggle.textContent = 'ⓘ';
  statsToggle.setAttribute('aria-expanded', String(!statsCollapsed));
  statsToggle.setAttribute('aria-label', statsCollapsed ? '展開統計' : '收合統計');
}
function toggleStats() {
  statsCollapsed = !statsCollapsed;
  try { localStorage.setItem('mirage.statsCollapsed', statsCollapsed ? '1' : '0'); } catch {}
  renderStats();
}
statsToggle.addEventListener('click', toggleStats);
panel.addEventListener('click', toggleStats);
function reportError(message) {
  errorPanel.textContent = message;
  errorPanel.hidden = false;
  note(message);
}
renderStats();
const query = `?t=${encodeURIComponent(token)}`;
// 保留配對驗證；manifest 不指定 start_url，安裝時使用目前含 token 的文件網址。
document.querySelector('#manifest').setAttribute('href', '/manifest.webmanifest' + query);
const hw = 'no-preference';
let codec = null, configurationFailed = false;
const dropReasons = {gap:0, backlog:0, error:0, waitIDR:0};
const base = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`;
let decoder, video, input, wake, decoded = 0, lastDecoded = 0, received = 0, gaps = 0, localDrops = 0;
let lastSeq = null, waiting = true, rtt = NaN, samples = [], pending = new Map(), tick = performance.now();
let idleFlushTimer = null, keyframeRequested = false, flushingDecoder = null;
let reconnectAttempts = 0, reconnectTimer = null, connectionTimer = null, generation = 0;
let reconnecting = false, inputReady = false, frameReady = false, decodeErrors = 0;
let status = 'initializing', lastTouch = 'none', inputDrops = 0;
const lines = [];
function note(s) { lines.push(`${new Date().toISOString()} ${s}`); if(lines.length > 180) lines.shift(); log.textContent = lines.join('\n'); log.scrollTop = log.scrollHeight; }
// Annex-B 的三／四位元組起始碼都可找到 SPS；略過 NAL header 後取 PPCCLL。
function codecFromAccessUnit(bytes) {
  for (let i = 0; i + 6 < bytes.length; i++) {
    if (bytes[i] === 0 && bytes[i + 1] === 0 && bytes[i + 2] === 1) {
      if ((bytes[i + 3] & 0x1f) === 7) {
        return 'avc1.' + [bytes[i + 4], bytes[i + 5], bytes[i + 6]]
          .map(b => b.toString(16).padStart(2, '0').toUpperCase()).join('');
      }
      i += 2;
    }
  }
  return null;
}
// configure 失敗後鎖住解碼；重新整理才重試，錯誤即使 stats=0 也可見。
function configureDecoder() {
  try {
    decoder.configure(config());
    return true;
  } catch (e) {
    clearForegroundTimeout(connectionTimer);
    configurationFailed = true;
    status = `configure failed (${codec}): ${e.message}`;
    reportError(status);
    return false;
  }
}
function config() { return {codec, optimizeForLatency:true, hardwareAcceleration:hw}; }
function cancelIdleFlush() {
  clearTimeout(idleFlushTimer);
  idleFlushTimer = null;
}
function requestKeyframe() {
  if (flushingDecoder && flushingDecoder === decoder) return;
  if (!keyframeRequested && video?.readyState === WebSocket.OPEN && video.bufferedAmount < 65536) {
    video.send('keyframe');
    keyframeRequested = true;
  }
}
function scheduleIdleFlush() {
  cancelIdleFlush();
  const target = decoder;
  idleFlushTimer = setTimeout(async () => {
    idleFlushTimer = null;
    if (decoder !== target || target?.state !== 'configured') return;
    // PM iPhone 實測：SPS 改寫後 pending=0、arrival→output p50/p95=5/6ms。
    // 250ms P-frame 心跳會持續輸出；100ms flush 曾造成 101 幀中 92 張 IDR、App 約 70% CPU。
    // 只在 2 秒無 chunk 時才 flush；WebCodecs 此後要求 keyframe，不 reset 丟棄待輸出畫面。
    waiting = true;
    flushingDecoder = target;
    try { await target.flush(); }
    catch (e) { note('idle flush: ' + e.message); } // reset／close 的競態也不是致命錯誤。
    if (flushingDecoder === target) flushingDecoder = null;
    if (decoder === target && target.state === 'configured' && waiting) requestKeyframe();
  }, 2000);
}
function reset(reason, category = 'error') {
  cancelIdleFlush();
  keyframeRequested = false;
  dropReasons[category] += pending.size;
  localDrops += pending.size;
  pending.clear();
  waiting = true;
  if (decoder && decoder.state !== 'closed' && codec && !configurationFailed) {
    decoder.reset(); configureDecoder();
  }
  note(`${reason}; drops=${JSON.stringify(dropReasons)}`);
}
// Close/recreate also handles WebCodecs error callbacks that have already closed the decoder.
function discardDecoder() {
  cancelIdleFlush();
  if (decoder && decoder.state !== 'closed') decoder.close();
  decoder = null;
  flushingDecoder = null;
  dropReasons.error += pending.size;
  localDrops += pending.size;
  pending.clear();
  waiting = true;
  keyframeRequested = false;
}
function recoverDecoder(e) {
  discardDecoder();
  decodeErrors++;
  if (decodeErrors >= 3) {
    clearForegroundTimeout(connectionTimer);
    configurationFailed = true;
    status = 'decoder failed after 3 consecutive errors; reload to reconnect';
    reportError(status);
    return;
  }
  note(`decoder recovery (${decodeErrors}/3): ${e.message}`);
  decoder = makeDecoder();
  if (codec && !configureDecoder()) return;
  requestKeyframe();
}
function connectionHealthy() {
  if (!inputReady || !frameReady || configurationFailed) return;
  if (connectionTimer === null && !reconnecting) return;
  clearForegroundTimeout(connectionTimer);
  connectionTimer = null;
  reconnecting = false;
  reconnectAttempts = 0;
  status = 'streaming';
  startStatsTimer();
  errorPanel.hidden = true;
}
// Count only visible time: delayed background callbacks must not spend the retry budget.
let foregroundElapsed = 0;
let foregroundSince = document.visibilityState === 'visible' ? performance.now() : null;
const foregroundTimers = new Set();
function foregroundNow() {
  return foregroundElapsed + (foregroundSince === null ? 0 : performance.now() - foregroundSince);
}
function armForegroundTimer(timer) {
  clearTimeout(timer.handle);
  if (document.visibilityState !== 'visible') return;
  timer.handle = setTimeout(() => {
    if (!foregroundTimers.has(timer) || document.visibilityState !== 'visible') return;
    if (foregroundNow() < timer.deadline) { armForegroundTimer(timer); return; }
    foregroundTimers.delete(timer);
    timer.callback();
  }, Math.max(0, timer.deadline - foregroundNow()));
}
function setForegroundTimeout(callback, delay) {
  const timer = {callback, deadline:foregroundNow() + delay, handle:null};
  foregroundTimers.add(timer);
  armForegroundTimer(timer);
  return timer;
}
function clearForegroundTimeout(timer) {
  if (!timer) return;
  clearTimeout(timer.handle);
  foregroundTimers.delete(timer);
}
function updateForegroundClock() {
  if (document.visibilityState === 'visible') {
    if (foregroundSince === null) foregroundSince = performance.now();
  } else if (foregroundSince !== null) {
    foregroundElapsed += performance.now() - foregroundSince;
    foregroundSince = null;
  }
  for (const timer of foregroundTimers) armForegroundTimer(timer);
}
function reconnect(reason, immediately = false) {
  if (reconnectTimer !== null) return;
  generation++; // Ignore callbacks (including delayed output/flush) from the old pair.
  clearForegroundTimeout(connectionTimer);
  connectionTimer = null;
  for (const socket of [video, input]) {
    if (socket) { socket.onclose = socket.onerror = socket.onmessage = socket.onopen = null; socket.close(); }
  }
  video = input = null;
  rtt = NaN;
  inputReady = frameReady = false;
  active.clear();
  discardDecoder();
  lastSeq = null;
  if (reconnectAttempts >= 3) {
    stopStatsTimer();
    reconnecting = false;
    status = `${reason}; reload to reconnect`;
    reportError(status);
    return;
  }
  reconnecting = true;
  status = `reconnecting (${immediately ? reconnectAttempts : reconnectAttempts + 1}/3)`;
  panel.textContent = status;
  errorPanel.hidden = true;
  note(`${reason}; ${status}`);
  if (immediately) { start(); return; }
  reconnectTimer = setForegroundTimeout(() => {
    reconnectTimer = null;
    reconnectAttempts++;
    start();
  }, 1000 * 2 ** reconnectAttempts);
}
function makeDecoder() {
  const target = new VideoDecoder({
    output(frame) {
      if (decoder !== target) { frame.close(); return; }
      decodeErrors = 0;
      frameReady = true;
      connectionHealthy();
      const now = performance.now(), arrived = pending.get(frame.timestamp);
      if (arrived !== undefined) {
        samples.push(now - arrived);
        pending.delete(frame.timestamp);
      }
      try {
        if(canvas.width !== frame.displayWidth || canvas.height !== frame.displayHeight) {
          canvas.width = frame.displayWidth; canvas.height = frame.displayHeight;
          resizeViewport();
        }
        ctx.drawImage(frame, 0, 0, canvas.width, canvas.height); decoded++;
      } finally { frame.close(); }
    },
    error(e) { if (decoder === target) recoverDecoder(e); }
  });
  return target;
}

/* MIRAGE_VIEWER_INPUT */
</script></html>
