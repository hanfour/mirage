# Drone CI —— 這份設定刻意只做一件事：呼叫 app/scripts/ci.sh。
#
# 閘門的邏輯全部在那支腳本裡，不在這裡。理由有二：
#   1. 那支腳本在本機就能跑、就能驗證（而且已經驗過：三個閘門都證明過會紅，
#      見 docs/specs/2026-07-29-project-review.md 的 D10 條目）；
#      寫在 YAML 裡的邏輯只有等 CI 真的跑起來才知道對不對。
#   2. 換 CI 平台時不必重寫閘門。
#
# ⚠️ 這份 YAML 本身尚未被執行過（2026-07-29：本專案還沒有 git remote，也還沒有
#    Drone server）。在真的跑過一次之前，請把它當草稿而不是驗收依據。
#
# 前置條件（缺一不可，目前三項都還沒有）：
#
#   1. **一個 Drone 看得到的 git remote**。Drone 靠 webhook 驅動，需要 GitHub /
#      Gitea / GitLab 其中之一。本 repo 目前 `git remote -v` 是空的。
#
#   2. **exec runner，跑在 macOS 主機上**。不能用 Drone 預設的 docker runner——
#      那是 Linux 容器，而本專案 `Package.swift` 宣告 `platforms: [.macOS(.v14)]`，
#      MirageShell 依賴 AppKit 與 Metal，在 Linux 上根本編不起來。
#      exec runner 直接在主機上跑指令，所以那台主機需要裝好 Xcode CommandLineTools
#      （實測版本：Apple Swift 6.2.3）。
#
#   3. **exec runner 的主機上不要有模擬器佔用 CI_DEAD_PORT**。ci.sh 的閘門 0 會
#      自己檢查並在被佔用時中止，不會靜默地把「有後端」的跑次當成 hermetic。
#
# 未涵蓋的部分（誠實列出，不要誤以為 CI 綠就等於全都驗過）：
#   - 所有活體測試（MIRAGE_LIVE 系列）需要真模擬器，CI 不跑。
#   - 覆蓋率（scripts/coverage.sh）需要真模擬器且會觸發 guest 發聲，CI 不跑。
#   - GUI 路徑（⌘Q 拆除、overlay、Metal 渲染）headless 驅動不了。

kind: pipeline
type: exec
name: gate

platform:
  os: darwin
  arch: arm64

steps:
  - name: quality-gate
    commands:
      - cd app && ./scripts/ci.sh

trigger:
  branch:
    - main
  event:
    - push
    - pull_request
